[project]
name = "pe6203-mcpevol-adapter"
version = "0.1.0"
description = "Reproducible MCPEvol-Bench environment and runner for PE6203 Project 4"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==1.25.0",
    "openai==2.16.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]

[project.scripts]
pe6203 = "pe6203.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pe6203", "integration"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: starts real released MCP services; requires bootstrap", "artifact_isolation: actual restricted Docker execution; reviewed pinned local image required"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
