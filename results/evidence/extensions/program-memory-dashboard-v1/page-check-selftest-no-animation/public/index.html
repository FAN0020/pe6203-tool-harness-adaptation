<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><style>@keyframes glow{to{opacity:.5}}h1{animation:none}[data-stat]{background:#ddf;border:1px solid;padding:1rem}</style><h1 data-role="dynamic-title">Checker self-test</h1><div data-stat="total_errors"></div><div data-stat="days_covered"></div><div data-stat="busiest_day"></div><table><tbody></tbody></table><script>fetch('data.json').then(r=>r.json()).then(d=>{for(const k of ['total_errors','days_covered','busiest_day'])document.querySelector('[data-stat="'+k+'"]').textContent=k+': '+d[k];document.querySelector('tbody').innerHTML=d.daily.map(r=>'<tr data-date="'+r.date+'"><td>'+r.date+'</td><td>'+r.errors+'</td></tr>').join('')});</script>
